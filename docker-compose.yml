services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: domainslot
      POSTGRES_PASSWORD: domainslot
      POSTGRES_DB: domainslot
      TZ: Asia/Shanghai
    volumes:
      - domainslot-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domainslot -d domainslot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    image: ghcr.io/biubiubiu125/domainslot:v0.0.1
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://domainslot:domainslot@db:5432/domainslot}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8788:8788"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/api/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped

volumes:
  domainslot-pg:
